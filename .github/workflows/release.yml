name: Release

# A tag v<version> on main builds once, deploys that build to Cloudflare Pages and checks the
# served files against it. No push to main deploys anything. The cloudflare-pages environment
# allows only v* tags and holds CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ORIGIN, the
# origin the check reads (docs/deployment.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tag
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Write the manifest
        # Pages consumes _headers instead of serving it.
        run: |
          mkdir release
          (cd dist && find . -type f ! -name _headers | sed 's|^\./||' | sort | xargs sha256sum) \
            > release/manifest.sha256
          cp -R dist release/site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ vars.ORIGIN }}
    outputs:
      origin: ${{ steps.origin.outputs.origin }}
    steps:
      - name: Check the origin
        id: origin
        env:
          ORIGIN: ${{ vars.ORIGIN }}
        run: |
          case "$ORIGIN" in
            https://btc-elliott.allisson.dev | https://btc-elliott-dashboard.pages.dev) ;;
            *) echo "::error::ORIGIN of the cloudflare-pages environment is '$ORIGIN'"; exit 1 ;;
          esac
          echo "origin=$ORIGIN" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      # wrangler installs into its own directory, so nothing but the build is uploaded.
      - run: mkdir wrangler
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        env:
          WRANGLER_SEND_METRICS: 'false'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.152.0'
          packageManager: npm
          workingDirectory: wrangler
          command: >-
            pages deploy ../release/site --project-name=btc-elliott-dashboard --branch=main
            --commit-hash=${{ github.sha }} --commit-message=${{ github.ref_name }}

  verify:
    # Checks static files only: GitHub's runners get HTTP 451 from Binance, so live data is
    # checked in a browser.
    name: Check the served files against the build
    needs: deploy
    runs-on: ubuntu-latest
    env:
      ORIGIN: ${{ needs.deploy.outputs.origin }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Compare the served files
        run: |
          mkdir served
          cd served
          # The CDN may serve the previous deployment for a while. Pages redirects /index.html to
          # /, so every request follows redirects, over HTTPS only.
          for attempt in $(seq 1 20); do
            curl -fsSL --proto '=https' --proto-redir '=https' "$ORIGIN/?run=$GITHUB_RUN_ID-$attempt" \
              -o index.html || true
            if cmp -s index.html ../release/site/index.html; then break; fi
            sleep 30
          done
          cmp index.html ../release/site/index.html
          # The manifest is the build's, so its paths are trusted.
          while read -r _ path; do
            mkdir -p "$(dirname "$path")"
            curl -fsSL --proto '=https' --proto-redir '=https' "$ORIGIN/$path?run=$GITHUB_RUN_ID" -o "$path"
          done < ../release/manifest.sha256
          sha256sum -c --quiet ../release/manifest.sha256
      - name: Check the security headers
        run: |
          curl -fsSIL --proto '=https' --proto-redir '=https' "$ORIGIN/?run=$GITHUB_RUN_ID" \
            | tr -d '\r' > headers.txt
          grep -qi '^content-security-policy: default-src' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          echo "Served at $ORIGIN: manifest sha256 \`$(sha256sum release/manifest.sha256 | cut -d' ' -f1)\`" \
            >> "$GITHUB_STEP_SUMMARY"
